[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lumix-mdt-repair"
version = "1.0.0"
description = "Recover Panasonic LUMIX .MDT interrupted recordings with video AND audio at original quality"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Srijay Kasturi" }]
requires-python = ">=3.8"
keywords = ["panasonic", "lumix", "gh5", "mdt", "video-recovery", "mp4", "untrunc", "moov"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Environment :: Console",
]

[project.scripts]
mdt-repair = "mdt_repair:main"

[tool.setuptools]
py-modules = ["mdt_repair"]
